<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DESTROYED TOOLS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030705;color:#00ff88;
 font-family:Consolas,monospace;padding:20px
}
.wrap{max-width:760px;margin:auto}
header{
 border-bottom:1px solid #164b30;
 padding:15px 0;margin-bottom:22px
}
h1{font-size:25px;letter-spacing:3px}
.muted{color:#749b83;font-size:12px}
.panel{
 background:#08110b;border:1px solid #17482d;
 border-radius:8px;padding:18px;margin:14px 0
}
input{
 width:100%;padding:13px;background:#020503;
 border:1px solid #1b633a;color:#00ff88;
 border-radius:5px;font-family:inherit
}
button{
 width:100%;padding:13px;margin-top:12px;
 background:#062514;color:#00ff88;
 border:1px solid #00a957;border-radius:5px;
 font-family:inherit;font-weight:bold
}
button:active{background:#124b2b}
#terminal{
 background:#010302;border:1px solid #143d27;
 min-height:180px;padding:15px;line-height:1.9;
 overflow-wrap:anywhere;font-size:13px
}
.bar{height:7px;background:#15251a;margin-top:15px}
#progress{height:100%;width:0;background:#00ff88}
.green{color:#00ff88}
footer{margin-top:24px;color:#63826d;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>DESTROYED TOOLS</h1>
 <div class="muted">CYBER OPERATIONS CONSOLE</div>
 <p>● SYSTEM READY</p>
</header>

<div class="panel">
 <h3>WEBSITE ANALYZER</h3>
 <input id="url" type="url"
 placeholder="https://example.com">
 <button onclick="analyze()">ANALYZE DOMAIN</button>
</div>

<div class="panel">
 <h3>TERMINAL OUTPUT</h3>
 <div id="terminal">root@destroyed:~$ Ready for input...</div>
 <div class="bar"><div id="progress"></div></div>
</div>

<div class="panel">
 <h3>SYSTEM STATUS</h3>
 <p>Interface: <span class="green">ACTIVE</span></p>
 <p>Console: <span class="green">READY</span></p>
 <p class="muted">Website status is not verified by this interface.</p>
</div>

<footer>DESTROYED TOOLS // CYBER INTERFACE</footer>
</div>

<script>
function analyze(){
 const input=document.getElementById("url").value.trim();
 const term=document.getElementById("terminal");
 const bar=document.getElementById("progress");
 let domain;

 try{
  const parsed=new URL(input);
  if(!["http:","https:"].includes(parsed.protocol))
   throw new Error();
  domain=parsed.hostname;
 }catch{
  term.textContent="ERROR: Enter a valid website URL.";
  return;
 }

 bar.style.width="0";
 term.textContent=
  "root@destroyed:~$ analyze --domain "+domain+"\n"+
  "> Parsing URL...\n"+
  "> Reading hostname...\n"+
  "> Preparing domain report...\n"+
  "> URL analysis complete.\n"+
  "Domain: "+domain+"\n"+
  "Protocol: "+new URL(input).protocol+"\n"+
  "Result: INPUT VALIDATED";

 bar.style.width="100%";
}
</script>
</body>
</html>
